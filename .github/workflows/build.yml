name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc \
            g++ \
            make \
            git \
            zip \
            unzip \
            openjdk-11-jdk \
            python3-pip \
            python3-dev \
            autoconf \
            automake \
            autopoint \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev \
            lbzip2

      - name: Check compilers
        run: |
          gcc --version
          g++ --version
          make --version
          java -version

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --upgrade buildozer
          python3 -m pip install "Cython==0.29.34"

      - name: Fix buildozer.spec
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("buildozer.spec")
          text = p.read_text(encoding="utf-8")

          # Fix minimum Android API
          text = text.replace(
              "android.minapi = 23",
              "android.minapi = 24"
          )

          # Remove old android.arch lines
          lines = text.splitlines()
          result = []
          arch_added = False

          for line in lines:
              if line.strip().startswith("android.arch"):
                  if not arch_added:
                      result.append(
                          "android.archs = arm64-v8a, armeabi-v7a"
                      )
                      arch_added = True
                  continue

              result.append(line)

          text = "\n".join(result)

          # Add android.archs if it doesn't exist
          if "android.archs =" not in text:
              text = text.replace(
                  "[app]",
                  "[app]\nandroid.archs = arm64-v8a, armeabi-v7a",
                  1
              )

          # Add SDK license acceptance
          if "android.accept_sdk_license" not in text:
              text = text.replace(
                  "[app]",
                  "[app]\nandroid.accept_sdk_license = True",
                  1
              )

          p.write_text(text + "\n", encoding="utf-8")
          PY

          echo "===== BUILD CONFIG ====="
          grep -E \
            "^(requirements|android\.archs|android\.api|android\.minapi|android\.ndk|android\.accept_sdk_license)" \
            buildozer.spec || true

      - name: Build APK
        env:
          CC: gcc
          CXX: g++
        run: |
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ExpenseNotes-APK
          path: bin/*.apk
          if-no-files-found: error
