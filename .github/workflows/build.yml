name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc \
            g++ \
            make \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            python3-pip \
            python3-dev \
            autoconf \
            automake \
            autopoint \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev \
            lbzip2

      - name: Check compilers
        run: |
          gcc --version
          g++ --version
          make --version
          java -version

      - name: Install Buildozer
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install \
            "buildozer" \
            "Cython==0.29.34"

      - name: Fix buildozer.spec
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("buildozer.spec")
          text = p.read_text(encoding="utf-8")

          # Android minimum API
          import re
          text = re.sub(
              r"^android\.minapi\s*=.*$",
              "android.minapi = 24",
              text,
              flags=re.MULTILINE
          )

          # Use modern KivyMD 2.0.0 and explicitly list its Android dependencies
          text = re.sub(
              r"^requirements\s*=.*$",
              "requirements = python3,kivy,kivymd==2.0.0,pillow,materialyoucolor==3.0.3,materialshapes,pycairo,exceptiongroup,asyncgui,asynckivy,android",
              text,
              flags=re.MULTILINE
          )

          # Use stable p4a master instead of the current develop branch
          if re.search(r"^p4a\.branch\s*=", text, re.MULTILINE):
              text = re.sub(
                  r"^p4a\.branch\s*=.*$",
                  "p4a.branch = master",
                  text,
                  flags=re.MULTILINE
              )
          else:
              text = text.replace(
                  "[app]",
                  "[app]\np4a.branch = master",
                  1
              )

          # Remove old duplicate android.arch
          lines = text.splitlines()
          result = []
          arch_added = False

          for line in lines:
              if line.strip().startswith("android.arch"):
                  if not arch_added:
                      result.append(
                          "android.archs = arm64-v8a, armeabi-v7a"
                      )
                      arch_added = True
                  continue

              result.append(line)

          text = "\n".join(result)

          if "android.archs =" not in text:
              text = text.replace(
                  "[app]",
                  "[app]\nandroid.archs = arm64-v8a, armeabi-v7a",
                  1
              )

          # Android SDK license
          if "android.accept_sdk_license" not in text:
              text = text.replace(
                  "[app]",
                  "[app]\nandroid.accept_sdk_license = True",
                  1
              )

          p.write_text(text + "\n", encoding="utf-8")
          PY

          echo "===== BUILD CONFIG ====="
          grep -E \
            "^(requirements|android\.archs|android\.api|android\.minapi|android\.ndk|android\.accept_sdk_license|p4a\.branch)" \
            buildozer.spec || true

      - name: Clean previous Buildozer files
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build APK
        env:
          CC: gcc
          CXX: g++
        run: |
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ExpenseNotes-APK
          path: bin/*.apk
          if-no-files-found: error
