name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            gcc \
            g++ \
            make \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            python3-pip \
            python3-dev \
            python3-venv \
            autoconf \
            automake \
            autopoint \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev \
            lbzip2

      - name: Check tools
        run: |
          echo "===== GCC ====="
          gcc --version

          echo "===== G++ ====="
          g++ --version

          echo "===== Python ====="
          python3 --version

          echo "===== Java ====="
          java -version

          echo "===== Make ====="
          make --version

      - name: Install Buildozer
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --upgrade buildozer
          python3 -m pip install "Cython==0.29.34"

      - name: Clean old Buildozer files
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Prepare python-for-android
        run: |
          mkdir -p "$HOME/.buildozer/android/platform"

          git clone \
            --depth 1 \
            --branch master \
            https://github.com/kivy/python-for-android.git \
            "$HOME/.buildozer/android/platform/python-for-android"

          cd "$HOME/.buildozer/android/platform/python-for-android"

          echo "===== P4A VERSION ====="
          git log -1 --oneline

          echo "===== PATCH P4A VENV ====="

          sed -i \
            "s/shprint(host_python, '-m', 'venv', 'venv')/shprint(host_python, '-m', 'venv', '--clear', 'venv')/" \
            pythonforandroid/build.py

          echo "===== CHECK PATCH ====="

          grep -n "venv" pythonforandroid/build.py | head -20

      - name: Fix buildozer.spec
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("buildozer.spec")
          text = p.read_text(encoding="utf-8")

          # Android minimum API
          text = re.sub(
              r"^android\.minapi\s*=.*$",
              "android.minapi = 24",
              text,
              flags=re.MULTILINE
          )

          # KivyMD 2.0.0
          text = re.sub(
              r"^requirements\s*=.*$",
              "requirements = python3,kivy,kivymd==2.0.0,pillow,materialyoucolor==3.0.3,materialshapes,pycairo,exceptiongroup,asyncgui,asynckivy,android",
              text,
              flags=re.MULTILINE
          )

          # P4A master
          if re.search(r"^p4a\.branch\s*=", text, re.MULTILINE):
              text = re.sub(
                  r"^p4a\.branch\s*=.*$",
                  "p4a.branch = master",
                  text,
                  flags=re.MULTILINE
              )
          else:
              text = text.replace(
                  "[app]",
                  "[app]\np4a.branch = master",
                  1
              )

          # Remove duplicate android.arch / android.archs
          lines = text.splitlines()
          result = []
          arch_added = False

          for line in lines:
              stripped = line.strip()

              if stripped.startswith("android.arch"):
                  if not arch_added:
                      result.append(
                          "android.archs = arm64-v8a, armeabi-v7a"
                      )
                      arch_added = True
                  continue

              result.append(line)

          text = "\n".join(result)

          # Add architecture if missing
          if "android.archs =" not in text:
              text = text.replace(
                  "[app]",
                  "[app]\nandroid.archs = arm64-v8a, armeabi-v7a",
                  1
              )

          # Accept Android SDK license
          if "android.accept_sdk_license" not in text:
              text = text.replace(
                  "[app]",
                  "[app]\nandroid.accept_sdk_license = True",
                  1
              )

          p.write_text(text + "\n", encoding="utf-8")
          PY

          echo "===== FINAL BUILD CONFIG ====="

          grep -E \
            "^(requirements|android\.archs|android\.api|android\.minapi|android\.ndk|android\.accept_sdk_license|p4a\.branch)" \
            buildozer.spec || true

      - name: Verify python-for-android
        run: |
          echo "===== P4A LOCATION ====="
          ls -la "$HOME/.buildozer/android/platform/python-for-android"

          echo "===== P4A VENV PATCH ====="
          grep -n "venv" \
            "$HOME/.buildozer/android/platform/python-for-android/pythonforandroid/build.py" \
            | head -20

      - name: Build APK
        env:
          CC: gcc
          CXX: g++
        run: |
          buildozer -v android debug

      - name: Check APK
        run: |
          echo "===== BIN DIRECTORY ====="
          ls -lah bin || true

          echo "===== APK FILES ====="
          find bin -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ExpenseNotes-APK
          path: bin/*.apk
          if-no-files-found: error
